[project]
name = "glpi-sql-ai"
version = "0.1.0"
description = ""
packages = [{ include = "glpi_sql_ai", from = "src" }]
authors = [
    {name = "Gabriel",email = "carloscgmorais@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13,<4.0.0"
dependencies = [
    "langchain (>=0.3.27,<0.4.0)",
    "langchain-community (>=0.3.30,<0.4.0)",
    "langchain-openai (>=0.3.33,<0.4.0)",
    "langchain-chroma (>=0.2.0,<0.4.0)",
    "chromadb (>=0.5.0,<0.7.0)",
    "langgraph (>=0.4.0,<0.5.0)",
    "mysql-connector-python (>=9.4.0,<10.0.0)",
    "python-dotenv (>=1.1.1,<2.0.0)",
    "sqlglot (>=25,<27)",
    "requests (>=2.31,<3)",
]

[tool.poetry]
packages = [{include = "glpi_sql_ai", from = "src"}]


[tool.poetry.group.dev.dependencies]
ruff = "^0.15.13"
pytest = ">=8,<9"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
